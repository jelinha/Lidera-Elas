<main class="blog-page">
    <section class="blog-shell" aria-labelledby="blog-title">
        <a routerLink="/" class="back-link">&larr; Voltar para a página inicial</a>

        <div class="blog-intro">
            <span class="section-tag">BLOG LIDERA ELAS</span>
            <h1 id="blog-title">Ideias para avançar<br><em>com intenção</em></h1>
            <p>Histórias, ferramentas e perspectivas para mulheres que estão construindo novos caminhos.</p>
        </div>

        <div class="posts-grid">
            @for (post of posts; track post.titulo) {
                <article class="post-card">
                    <div class="post-accent" aria-hidden="true"></div>
                    <time>{{ post.data }}</time>
                    <h2>{{ post.titulo }}</h2>
                    <p>{{ post.resumo }}</p>
                    <button type="button" class="read-button">Ler mais <span aria-hidden="true">&rarr;</span></button>
                </article>
            }
        </div>
    </section>
</main>
