<div class="sidebar-overlay" (click)="fechar()" aria-hidden="true"></div>
<aside class="app-sidebar" aria-label="Navegação da área restrita">
    <div class="sidebar-heading">
        <span class="sidebar-kicker">ÁREA RESTRITA</span>
        <strong>{{ perfilMentora ? 'Espaço da Mentora' : 'Espaço da Líder' }}</strong>
        <button type="button" class="sidebar-close" (click)="fechar()" aria-label="Fechar menu">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
            <span>Painel</span>
        </a>
        <a routerLink="/dashboard" fragment="trilhas" routerLinkActive="ativo">
            <i class="fa-solid fa-compass" aria-hidden="true"></i>
            <span>{{ perfilMentora ? 'Acompanhar alunas' : 'Minhas trilhas' }}</span>
        </a>
        <a routerLink="/novidades" routerLinkActive="ativo">
            <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
            <span>Novidades</span>
        </a>
        <a [routerLink]="perfilMentora ? ['/alunas', '1'] : ['/dashboard']" [fragment]="perfilMentora ? undefined : 'mentora-atribuida'">
            <i class="fa-solid fa-user-group" aria-hidden="true"></i>
            <span>{{ perfilMentora ? 'Minhas alunas' : 'Minha mentora' }}</span>
        </a>
    </nav>

    <button type="button" class="sidebar-logout" (click)="sair()">
        <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
        <span>Sair da conta</span>
    </button>
</aside>
